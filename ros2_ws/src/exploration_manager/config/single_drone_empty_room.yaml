exploration_node:
  ros__parameters:
    sdf_map.resolution: 0.1
    sdf_map.map_size_x: 20.0
    sdf_map.map_size_y: 20.0
    sdf_map.map_size_z: 5.0
    sdf_map.obstacles_inflation: 0.199
    sdf_map.local_bound_inflate: 0.5
    sdf_map.local_map_margin: 50
    sdf_map.ground_height: -0.5
    sdf_map.default_dist: 0.5
    sdf_map.p_hit: 0.70
    sdf_map.p_miss: 0.35
    sdf_map.p_min: 0.12
    sdf_map.p_max: 0.97
    sdf_map.p_occ: 0.80
    sdf_map.max_ray_length: 20.0
    sdf_map.virtual_ceil_height: -10.0
    sdf_map.optimistic: false
    sdf_map.signed_dist: true
    sdf_map.no_drone_1: false
    sdf_map.box_min_x: -9.0
    sdf_map.box_min_y: -9.0
    sdf_map.box_min_z: -0.5
    sdf_map.box_max_x: 9.0
    sdf_map.box_max_y: 9.0
    sdf_map.box_max_z: 4.0

    map_ros.frame_id: "world"
    map_ros.esdf_slice_height: 0.5
    map_ros.visualization_truncate_height: 3.0
    map_ros.visualization_truncate_low: -1.0
    map_ros.use_local_only: true
    map_ros.show_occ_time: true
    map_ros.show_esdf_time: true
    map_ros.show_all_map: true
    map_ros.virtual_ground_enable: true
    map_ros.virtual_ground_z: 0.0
    map_ros.virtual_ground_stride: 1

    fsm.thresh_replan1: 0.2
    fsm.thresh_replan2: 0.2
    # Was 1.5s: at manager.max_vel=1.0 that's only ~1.5m of committed travel before a forced
    # "periodic call" replan interrupts EXEC_TRAJ, even though manager.local_segment_length
    # plans segments up to 6m long - the drone was basically never allowed to fly a segment
    # to completion, constantly stopping to replan every ~1.5m. That short a leash, repeated
    # over many cycles, is a likely contributor to the "keeps circling the same small area"
    # pattern instead of covering new ground. 4.0s lets it commit closer to a full segment.
    fsm.thresh_replan3: 4.0
    fsm.replan_time: 0.20
    fsm.attempt_interval: 0.5
    fsm.meeting_opt_interval: 2.5
    fsm.state_fresh_timeout: 1.2
    fsm.opt_wait_timeout: 2.5
    fsm.opt_retry_interval: 0.35
    fsm.opt_retry_max: 4
    fsm.opt_reject_backoff: 0.8
    fsm.opt_reject_backoff_max: 2.5
    fsm.repeat_send_num: 1
    fsm.debug_opt_output: false
    # No-progress watchdog: over a sliding window of no_progress_timeout
    # seconds, a drone that gained less than no_progress_min_volume of newly
    # explored space concludes the frontiers it still holds cannot be cleared
    # from anywhere it can reach, and goes IDLE (-> FINISH). Without it a drone
    # flies at the same unreachable frontier indefinitely - seen twice, 181 and
    # 256 plan/execute cycles on a single frontier while the others had long
    # finished.
    #
    # min_volume is in m3 and a voxel is 0.001 m3 (resolution 0.1), so 2.0 m3 =
    # 2000 new voxels per window. The first version used 0.5 m3 = 500 voxels
    # and never fired once: at 192k lidar points/s even a drone orbiting one
    # spot scrapes that many new voxels, so the window kept sliding. A drone
    # genuinely closing its last frontier cluster reveals far more than this.
    # Keep the timeout well above the longest legitimate transit across the
    # scene at manager.max_vel - during which the lidar is mapping new space
    # anyway, so the window slides on its own. 0 disables the watchdog.
    fsm.no_progress_timeout: 45.0
    fsm.no_progress_min_volume: 2.0
    # Errore di inseguimento oltre il quale si ripianifica dalla posizione reale
    # invece che da quella predetta sulla traiettoria precedente. 0 = comportamento upstream.
    fsm.replan_reanchor_dist: 0.5

    color_r: 1.0
    color_g: 0.0
    color_b: 0.0
    color_a: 1.0

    partitioning.alpha_consistency: 1.15
    partitioning.w_distance: 1.0
    partitioning.w_global_dist_time: 1.0
    partitioning.w_global_turn_time: 1.0
    partitioning.w_global_z_change: 1.0
    # First attempt at 4.5 (16 cells, matching reference/C2-Explorer's own density ratio -
    # their cubicle_office.yaml uses grid_size=7.5 on a ~30x31m box, roughly box_size/4)
    # coincided with an unrelated real bug: position_command_bridge was declaring
    # velocity=true/acceleration=true in OffboardControlMode while PX4's position-only mode
    # (velocity=false/acceleration=false) is what this project's own earlier working
    # snapshot used - that mismatch, not the cell count, was what made flight erratic. With
    # that bridge bug reverted, retrying the denser partition here.
    partitioning.grid_size: 4.5
    partitioning.use_swarm_tf: false
    partitioning.ccl_step: 1

    exploration.refine_local: true
    exploration.refined_num: 7
    exploration.refined_radius: 5.0
    exploration.max_decay: 0.8
    exploration.top_view_num: 15
    exploration.vm: 1.0
    exploration.am: 1.0
    exploration.vz: 1.0
    exploration.yd: 1.0471975512
    exploration.ydd: 1.5707963268
    exploration.w_dir: 1.5
    exploration.tsp_dir: ""  # impostato dal launch (cartella di lavoro di LKH in /tmp)
    exploration.mtsp_dir: ""  # impostato dal launch (cartella di lavoro di LKH in /tmp)
    exploration.drone_num: 1
    exploration.drone_id: 1
    exploration.init_plan_num: 2
    exploration.prob_type: 2
    exploration.center_switch_penalty: 8.0
    exploration.center_stay_bonus: 8.0

    communication.connection_threshold: 10.0
    communication.neighbor_timeout: 2.0
    communication.heartbeat_interval: 0.04

    frontier.cluster_min: 60
    frontier.cluster_size_xy: 3.0
    frontier.cluster_size_z: 3.0
    frontier.min_candidate_dist: 0.5
    frontier.min_candidate_clearance: 0.11
    frontier.candidate_dphi: 0.2617993878
    frontier.candidate_rnum: 3
    frontier.candidate_rmin: 0.5
    frontier.candidate_rmax: 1.0
    frontier.down_sample: 1
    frontier.min_visib_num: 10
    frontier.min_view_finish_fraction: 0.2

    # Il sensore simulato e' 360 gradi in orizzontale (model.sdf: min_angle -pi,
    # max_angle +pi). Qui il modello di visibilita' dichiarava invece +-60 gradi,
    # cioe' uno spicchio frontale di 120: sottostimava le celle viste da ogni
    # punto di vista e faceva calcolare un'imbardata "per guardare" la frontiera,
    # che il sensore vedeva gia'. E ruotare COSTA: planTrajToView impone
    # time_lb = angolo / yd, quindi 180 gradi a 1.047 rad/s vincolano la
    # traiettoria ad almeno 3 s a prescindere dalla distanza da percorrere.
    # Allineato al sensore reale: tutti gli orientamenti sono equivalenti.
    perception_utils.lidar_pitch: 0.0
    perception_utils.lidar_top_angle: 0.8726646259971648
    perception_utils.lidar_bottom_angle: 0.8726646259971648
    perception_utils.lidar_left_angle: 3.1415926536
    perception_utils.lidar_right_angle: 3.1415926536
    perception_utils.lidar_max_dist: 22.0
    perception_utils.lidar_vis_dist: 1.0

    manager.max_vel: 1.0
    manager.max_acc: 1.0
    manager.local_segment_length: 6.0
    manager.control_points_distance: 0.5
    manager.use_geometric_path: true
    manager.use_kinodynamic_path: true
    manager.use_optimization: true
    manager.use_active_perception: true
    manager.min_time: true
    manager.relax_time1: 0.3
    manager.relax_time2: 1.5
    # Horizontal separation below which checkSwarmCollision declares a conflict
    # and the higher-id drone yields. Was hardcoded at 0.5m, about the x500's
    # own rotor span - i.e. it only fired once the two were already overlapping.
    # Must stay BELOW optimization.swarm_safe_dist (1.2): the optimizer is what
    # normally holds the drones apart, and this is the backstop for when it
    # failed. Set above it and the backstop fires while the optimizer is
    # perfectly happy, and the drones yield to each other continuously.
    manager.swarm_clearance: 0.9
    manager.max_yawdot: 2.0943951024

    search.max_tau: 0.8
    search.init_max_tau: 1.0
    search.max_vel: 1.0
    search.vel_margin: 0.25
    search.max_acc: 1.0
    search.w_time: 10.0
    search.horizon: 5.0
    search.lambda_heu: 10.0
    search.resolution_astar: 0.025
    search.time_resolution: 0.8
    search.allocate_num: 100000
    search.check_num: 10
    search.optimistic: false

    astar.lambda_heu: 10.0
    astar.resolution_astar: 0.3
    astar.allocate_num: 1000000
    astar.max_search_time: 0.003

    optimization.ld_smooth: 5.0
    optimization.ld_dist: 10.0
    optimization.ld_feasi: 2.0
    optimization.ld_start: 100.0
    optimization.ld_end: 0.5
    optimization.ld_guide: 1.5
    optimization.ld_waypt: 7.0
    optimization.ld_view: 0.0
    optimization.ld_time: 1.5
    # --- Inter-drone avoidance -----------------------------------------------
    # ld_swarm/swarm_safe_dist feed the B-spline optimizer's swarm term
    # (calcSwarmCost): a soft repulsion evaluated on an ellipsoid that is 2.5x
    # more tolerant vertically than horizontally, so it pushes drones apart
    # sideways rather than stacking them. Raised from 5.0/1.0 - at that setting
    # the term was routinely outweighed by ld_dist (10.0) and the drones flew
    # through each other, then fought over the same space until one tipped over.
    optimization.ld_swarm: 15.0
    optimization.swarm_safe_dist: 1.2
    optimization.dist0: 0.7
    optimization.max_vel: 1.0
    optimization.max_acc: 1.0
    optimization.algorithm1: 15
    optimization.algorithm2: 11
    optimization.max_iteration_num1: 2
    optimization.max_iteration_num2: 2000
    optimization.max_iteration_num3: 200
    optimization.max_iteration_num4: 200
    optimization.max_iteration_time1: 0.0001
    optimization.max_iteration_time2: 0.005
    optimization.max_iteration_time3: 0.003
    optimization.max_iteration_time4: 0.003

    bspline.limit_vel: 1.0
    bspline.limit_acc: 1.0
    bspline.limit_ratio: 1.1
